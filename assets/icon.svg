<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cb2ff"/>
      <stop offset="0.55" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#3a2fd6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile (source of icon.png: render at 512x512 with a transparent background) -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>

  <!-- Widget card with a sparkline -->
  <rect x="44" y="46" width="168" height="78" rx="20" fill="#fff" fill-opacity="0.2"/>
  <polyline points="62,104 88,86 110,96 136,68 160,82 194,60" fill="none" stroke="#fff"
    stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating dock -->
  <rect x="28" y="148" width="200" height="68" rx="24" fill="url(#bar)" filter="url(#shadow)"/>
  <!-- Start (Windows logo) -->
  <g fill="#0a84ff">
    <rect x="48" y="164" width="16" height="16" rx="3"/>
    <rect x="67" y="164" width="16" height="16" rx="3"/>
    <rect x="48" y="183" width="16" height="16" rx="3"/>
    <rect x="67" y="183" width="16" height="16" rx="3"/>
  </g>
  <!-- Apps -->
  <rect x="100" y="164" width="35" height="35" rx="10" fill="#ff9f0a"/>
  <rect x="145" y="164" width="35" height="35" rx="10" fill="#30d158"/>
  <!-- Running indicator -->
  <rect x="110" y="205" width="15" height="4" rx="2" fill="#0a84ff"/>
  <!-- Tray dot -->
  <circle cx="202" cy="181.5" r="9" fill="#ff375f"/>
</svg>
