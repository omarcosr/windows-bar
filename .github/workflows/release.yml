# Tags publish txiki; manual dispatch selects one runtime per release/feed.
# Requires TARVE_UPDATE_PRIVATE_KEY (Ed25519; not Authenticode).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0); the tag v<version> is created"
        required: true
      runtime:
        description: "App runtime (tags use txiki)"
        type: choice
        required: true
        default: txiki
        options: [txiki, bun, node]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"

      - name: Install txiki.js 26.6.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "txiki.zip"
          $directory = Join-Path $env:RUNNER_TEMP "txiki"
          Invoke-WebRequest "https://github.com/saghul/txiki.js/releases/download/v26.6.0/txiki-windows-x86_64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory
          $executables = @(Get-ChildItem $directory -Filter tjs.exe -Recurse)
          if ($executables.Count -ne 1) { throw "Expected one tjs.exe in txiki archive" }
          $executable = $executables[0].FullName
          "TARVE_TXIKI=$executable" >> $env:GITHUB_ENV
          $executables[0].DirectoryName >> $env:GITHUB_PATH
          & $executable --version
          if ($LASTEXITCODE -ne 0) { throw "txiki version check failed" }

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9_.]+)?$ ]]; then
            echo "::error::Invalid release version"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check signing key
        shell: bash
        env:
          TARVE_UPDATE_PRIVATE_KEY: ${{ secrets.TARVE_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$TARVE_UPDATE_PRIVATE_KEY" ]; then
            echo "::error::Secret TARVE_UPDATE_PRIVATE_KEY is missing"
            exit 1
          fi

      - name: Build, package, sign and publish
        env:
          TARVE_UPDATE_PRIVATE_KEY: ${{ secrets.TARVE_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_RUNTIME: ${{ inputs.runtime || 'txiki' }}
        shell: pwsh
        run: bun scripts/release.ts "$env:RELEASE_VERSION" --runtime "$env:RELEASE_RUNTIME" --publish --notes "WindowsBar $env:RELEASE_VERSION"
