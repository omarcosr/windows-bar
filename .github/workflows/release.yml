# Builds and publishes a release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# Produces WindowsBar.exe (self-update payload), the setup installer, a zip and the signed
# latest.json the app polls (releases/latest/download/latest.json).
# Needs the repository secret TARVE_UPDATE_PRIVATE_KEY (contents of windows-bar-update.key).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0); the tag v<version> is created"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check signing key
        shell: bash
        env:
          TARVE_UPDATE_PRIVATE_KEY: ${{ secrets.TARVE_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$TARVE_UPDATE_PRIVATE_KEY" ]; then
            echo "::error::Secret TARVE_UPDATE_PRIVATE_KEY is missing (gh secret set TARVE_UPDATE_PRIVATE_KEY < windows-bar-update.key)"
            exit 1
          fi

      - name: Build, package, sign and publish
        env:
          TARVE_UPDATE_PRIVATE_KEY: ${{ secrets.TARVE_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release.ts ${{ steps.version.outputs.version }} --publish --notes "WindowsBar ${{ steps.version.outputs.version }}"
